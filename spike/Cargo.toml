[package]
name = "maki-uds-perf-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone crate outside the maki workspace (per spec: never merged, gates D1).
[workspace]

[dependencies]
flume = "0.11"
smol = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[[bin]]
name = "spike"
path = "src/main.rs"
